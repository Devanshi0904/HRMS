{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}HRMS{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <div class="sidebar">

        <div class="logo">
            <h3>HRMS</h3>
        </div>

        <ul>

            <li>
                <a href="/dashboard/">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="/department-page/">
                    <i class="bi bi-building"></i>
                    Department
                </a>
            </li>

            <li>
                <a href="/employee-page/">
                    <i class="bi bi-people"></i>
                    Employee
                </a>
            </li>

            <li>
                <a href="/attendance-page/">
                    <i class="bi bi-calendar-check"></i>
                    Attendance
                </a>
            </li>

            <li>
                <a href="/leave-page/">
                    <i class="bi bi-journal-text"></i>
                    Leave
                </a>
            </li>

            <li>
                <a href="/payroll-page/">
                    <i class="bi bi-cash-stack"></i>
                    Payroll
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="/dashboard/tasks.html">
                    <i class="bi bi-check2-square"></i> Tasks
                </a>
            </li>

            <li>
                <a href="/">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>

        </ul>

    </div>

    <div class="main-content">

        <nav class="navbar navbar-expand-lg bg-white shadow-sm rounded mb-4">

            <div class="container-fluid">

                <span class="navbar-brand fw-bold">
                    Human Resource Management System
                </span>

            </div>

        </nav>

        {% block content %}
        {% endblock %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    {% block script %}
    {% endblock %}

</body>

</html>
