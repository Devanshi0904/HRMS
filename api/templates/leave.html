{% extends 'base.html' %}
{% load static %}

{% block title %}Leave Management{% endblock %}

{% block content %}

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Leave Management</h3>

    </div>

    <!-- Search Input -->
    <div class="mb-3">
        <input type="text" id="searchLeave" class="form-control" placeholder="Search Leave..." onkeyup="searchLeave()">
    </div>

    <!-- Leave Table -->
    <table class="table table-bordered table-hover">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Leave Type</th>
                <th>From Date</th>
                <th>To Date</th>
                <th>Status</th>
                <th>Reason</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="leaveTableBody">
        </tbody>
    </table>
</div>

<!-- ===================== LEAVE MODAL ===================== -->
<div class="modal fade" id="leaveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Leave</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="leave_id">

                <!-- Employee Field -->
                <div class="mb-3">
                    <label class="form-label">Employee</label>
                    <!-- Add Leave માટે Dropdown -->
                    <select id="employee" class="form-control">
                        <option value="">Select Employee</option>
                    </select>
                    <!-- Edit Leave માટે Direct Name Text -->
                    <input type="text" id="employee_display" class="form-control" readonly style="display: none;">
                </div>

                <!-- Leave Type -->
                <div class="mb-3">
                    <label class="form-label">Leave Type</label>

                    <select id="leave_type" class="form-select">
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Paid Leave">Paid Leave</option>
                    </select>
                </div>

                <!-- From Date -->
                <div class="mb-3">
                    <label class="form-label">From Date</label>
                    <input type="date" id="from_date" class="form-control">
                </div>

                <!-- To Date -->
                <div class="mb-3">
                    <label class="form-label">To Date</label>
                    <input type="date" id="to_date" class="form-control">
                </div>

                <!-- Reason -->
                <div class="mb-3">
                    <label class="form-label">Reason</label>
                    <textarea id="reason" class="form-control" rows="3"></textarea>
                </div>

                <!-- Status -->
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-select">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-success" onclick="saveLeave()">Save</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block script %}
<script src="{% static 'js/leave.js' %}"></script>
{% endblock %}
