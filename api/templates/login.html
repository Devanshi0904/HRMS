{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Login - Enterprise Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            /* રજિસ્ટ્રેશન પેજ જેવું જ શાનદાર ગ્રેડિયન્ટ બેકગ્રાઉન્ડ */
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-header h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #1e293b;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 12px;
            padding: 13px 16px;
            border: 1.5px solid #e2e8f0;
            font-size: 14.5px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        }

        #msg {
            font-size: 14px;
            font-weight: 500;
        }

        .register-redirect {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .register-redirect a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .register-redirect a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p class="login-subtitle">Sign in to your HRMS dashboard</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Sign In
            </button>
        </form>

        <div id="msg" class="text-center mt-3"></div>

        <!-- Optional: Register link if needed -->
        <div class="register-redirect">
            Don't have an account? <a href="{% url 'register_page' %}">Register</a>
        </div>
    </div>

    <script src="{% static 'js/login.js' %}"></script>

</body>

</html>
